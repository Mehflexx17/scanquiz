  <path d="M14 20 L14 14 L20 14" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M50 20 L50 14 L44 14" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none" />
