      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0d1117" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sqGrad)" filter="url(#glow)" />
  <rect x="8" y="8" width="48" height="48" rx="11" fill="#0f172a" />
  
