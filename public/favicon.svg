  <path d="M50 44 L50 50 L44 50" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Central Letters SQ -->
  <text x="32" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">SQ</text>
  <circle cx="44" cy="22" r="3" fill="#10b981" />
